name: Publish release

# On a version tag (e.g. v1.0.0): create a GitHub release with the site attached as a zip.
# The live site itself is deployed by "Publish main".
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check FitSM data and page script
        run: node scripts/check.js
      - name: Package site
        run: |
          mkdir -p "fitsm-process-map-${GITHUB_REF_NAME}"
          cp index.html fitsm-data.js README.md "fitsm-process-map-${GITHUB_REF_NAME}/"
          cp -r LICENSES "fitsm-process-map-${GITHUB_REF_NAME}/"
          zip -r "fitsm-process-map-${GITHUB_REF_NAME}.zip" "fitsm-process-map-${GITHUB_REF_NAME}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "fitsm-process-map-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
