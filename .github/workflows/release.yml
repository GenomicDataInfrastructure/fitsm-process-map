name: Publish release

# On a version tag (e.g. v1.0.0): create a GitHub release with the site attached as a zip.
# The live site itself is deployed by "Publish main".
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Check FitSM content, map and scripts
        run: node scripts/check.js
      - name: Package site
        run: |
          dir="fitsm-process-map-${GITHUB_REF_NAME}"
          mkdir -p "$dir"
          cp index.html styles.css README.md CHANGELOG.md "$dir/"
          cp -r src content LICENSES "$dir/"
          zip -r "$dir.zip" "$dir"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "fitsm-process-map-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
