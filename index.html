<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitSM Process Map</title>
  <meta name="description" content="A subway-style map of the 14 FitSM processes and their interfaces, with FitSM's requirements, roles, activities and records for each.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-title">
      <h1>FitSM Process Map</h1>
      <p id="edition-label" class="edition-label"></p>
    </div>
    <nav aria-label="Site">
      <a href="#GR" class="header-link">General requirements</a>
      <a href="#" class="header-link">Map</a>
    </nav>
  </header>

  <main class="layout">
    <div class="map-column">
      <div id="map" class="map"></div>
      <aside id="legend" class="legend" aria-labelledby="legend-title">
        <h2 id="legend-title">Lines are a study aid, not part of FitSM</h2>
        <ul id="legend-list"></ul>
      </aside>
    </div>
    <section id="panel" class="panel" aria-labelledby="panel-title">
      <h2 id="panel-title">Loading</h2>
    </section>
    <!-- Announces only the frame's new heading on each selection; the heading itself takes focus. -->
    <p id="status" class="visually-hidden" aria-live="polite"></p>
  </main>

  <footer id="site-footer" class="site-footer">
    <p id="attribution"></p>
    <p id="documents"></p>
  </footer>

  <noscript>
    <p class="noscript">This map needs JavaScript to load the FitSM content. The content itself is in
      the repository's <code>content/</code> folder as plain JSON.</p>
  </noscript>

  <script type="module" src="src/app.js"></script>
</body>
</html>
